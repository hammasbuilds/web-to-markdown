[project]
name = "web2md"
version = "0.1.0"
description = "Turn a web page into clean, agent-ready markdown with nothing but the standard library."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "html-to-markdown", "content-extraction", "boilerplate-removal", "web-scraping",
    "readability", "llm", "rag", "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
# No runtime dependencies: html.parser, re and urllib do the work.
dependencies = []

[project.scripts]
web2md = "web2md.cli:main"

[project.urls]
Homepage = "https://github.com/hammasbuilds/web-to-markdown"
Issues = "https://github.com/hammasbuilds/web-to-markdown/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff==0.16.7"]
# Only for bench/: the third-party extractors compared against, and tiktoken
# for real token counts. The library itself never imports any of these.
baselines = [
    "html2text==2025.4.15",
    "markdownify==1.2.3",
    "readability-lxml==0.9",
    "trafilatura==2.2.0",
    "tiktoken==0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web2md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
